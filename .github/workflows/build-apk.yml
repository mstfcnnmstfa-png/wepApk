
name: Web2APK Studio Builder

run-name: "Web2APK - ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique build ID from Base44
        required: true
        type: string
      url:
        description: Website URL to wrap
        required: true
        type: string
      app_name:
        description: Android app display name
        required: true
        type: string
      package_name:
        description: Android package ID
        required: true
        type: string
      color:
        description: Theme color in hex
        required: false
        type: string
        default: "#06b6d4"
      icon_b64:
        description: Optional Base64 icon
        required: false
        type: string
        default: ""
      output_format:
        description: APK only in this version
        required: false
        type: string
        default: "apk"
      orientation:
        description: auto, portrait or landscape
        required: false
        type: string
        default: "auto"
      status_bar_style:
        description: dark or light
        required: false
        type: string
        default: "dark"
      loading_style:
        description: spinner or bar
        required: false
        type: string
        default: "spinner"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Validate build request
        env:
          SITE_URL: ${{ inputs.url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          ORIENTATION: ${{ inputs.orientation }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          const u = new URL(process.env.SITE_URL);
          if (!['https:', 'http:'].includes(u.protocol)) {
            throw new Error('Website URL must use HTTP or HTTPS');
          }
          NODE

          if ! [[ "$PACKAGE_NAME" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "::error::Invalid Android package ID"
            exit 1
          fi

          if [ "$OUTPUT_FORMAT" != "apk" ]; then
            echo "::error::This version supports APK output only"
            exit 1
          fi

          case "$ORIENTATION" in
            auto|portrait|landscape) ;;
            *) echo "::error::Invalid orientation"; exit 1 ;;
          esac

      - name: Create Capacitor project
        env:
          SITE_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ORIENTATION: ${{ inputs.orientation }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p wrapper/www
          cd wrapper

          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const config = {
            appId: process.env.PACKAGE_NAME,
            appName: process.env.APP_NAME,
            webDir: 'www',
            server: {
              url: process.env.SITE_URL,
              cleartext: process.env.SITE_URL.startsWith('http://')
            }
          };

          fs.writeFileSync(
            'capacitor.config.json',
            JSON.stringify(config, null, 2)
          );

          fs.writeFileSync(
            'www/index.html',
            '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body></body></html>'
          );
          NODE

          npx cap add android
          npx cap sync android

          if [ "$ORIENTATION" != "auto" ]; then
            export ORIENTATION
            node --input-type=module <<'NODE'
            import fs from 'node:fs';

            const file = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(file, 'utf8');

            const activity = /<activity\b[^>]*>/;
            const match = xml.match(activity);

            if (!match) throw new Error('Android activity not found');

            const tag = match[0].replace(
              /\s+android:screenOrientation="[^"]*"/,
              ''
            );

            const updated = tag.slice(0, -1) +
              ` android:screenOrientation="${process.env.ORIENTATION}"` + '>';

            xml = xml.replace(tag, updated);
            fs.writeFileSync(file, xml);
            NODE
          fi

      - name: Build debug APK
        working-directory: wrapper/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="wrapper/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/${{ inputs.job_id }}.apk"

          SIZE=$(stat -c%s "dist/${{ inputs.job_id }}.apk")
          SHA=$(sha256sum "dist/${{ inputs.job_id }}.apk" | cut -d' ' -f1)

          {
            echo "## Web2APK Studio"
            echo "- Build ID: ${{ inputs.job_id }}"
            echo "- App: ${{ inputs.app_name }}"
            echo "- Package: ${{ inputs.package_name }}"
            echo "- APK size: $((SIZE / 1024)) KB"
            echo "- SHA-256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.job_id }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7
